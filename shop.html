<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="Images/favicon.svg">
    <title>Lydia's Nail Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gwendolyn:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Gwendolyn:wght@400;700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1><a href="index.html">Lydia's Nail Site</a></h1>
    </header>
    <nav class="navbar">
        <ul>
            <li><a href="index.html" data-text="Home">Home</a></li>
            <li><a href="inspiration.html" data-text="Inspiration Pics">Inspiration Pics</a></li>
            <li><a href="myNails.html" data-text="Nails by Me">Nails by Me</a></li>
            <li><a href="tutorials.html" data-text="Basic Tutorials">Basic Tutorials</a></li>
            <li><a href="shop.html" class="active" data-text="Shop">Shop</a></li>
            <li><a href="contact.html" data-text="Contact Me">Contact Me</a></li>
        </ul>
    </nav>

    <main>
    <h1 id="shopH1">Shop Nail Polish</h1>
    <div class="shop-container">
        <form id="shopForm" class="shop-form">
            <h2>Choose your polish</h2>
            <label>Color:
                <select id="color" name="color">
                    <option value="Primer" data-price="6.00">Primer - $6.00</option>
                    <option value="Base Gel" data-price="8.00">Base Gel - $8.00</option>
                    <option value="Glossy Top Coat" data-price="6.00">Glossy Top Coat - $6.00</option>
                    <option value="Matte Top Coat" data-price="6.00">Matte Top Coat - $6.00</option>

                    <option value="Bright Red" data-price="8.00">Bright Red - $8.00</option>
                    <option value="Deep Red" data-price="8.00">Deep Red - $8.00</option>
                    <option value="Blush Pink" data-price="7.50">Blush Pink - $7.50</option>
                    <option value="Hot Pink" data-price="7.50">Hot Pink - $7.50</option>
                    <option value="Burgundy" data-price="8.00">Burgundy - $8.00</option>
                    <option value="Orange" data-price="7.00">Orange - $7.00</option>
                    <option value="Yellow" data-price="7.00">Yellow - $7.00</option>
                    <option value="Green" data-price="7.00">Green - $7.00</option>
                    <option value="Baby Blue" data-price="7.00">Baby Blue - $7.00</option>
                    <option value="Sky Blue" data-price="7.00">Sky Blue - $7.00</option>
                    <option value="Lavender" data-price="7.50">Lavender - $7.50</option>
                    <option value="Plum" data-price="7.50">Plum - $7.50</option>
                    <option value="Brown" data-price="7.00">Brown - $7.00</option>
                    <option value="Black" data-price="6.50">Black - $6.50</option>
                    <option value="Classic White" data-price="6.50">Classic White - $6.50</option>
                    <option value="Pearly White" data-price="6.50">Pearly White - $6.50</option>
               
                    <option value="Cherry Chrome" data-price="10.00">Cherry Chrome - $10.00</option>
                    <option value="Gold Chrome" data-price="10.00">Gold Chrome - $10.00</option>
                </select>
            </label>
            <label>Quantity:
                <input type="number" id="quantity" name="quantity" min="1" max="20" value="1">
            </label>
            <p class="line-total">Item total: <strong id="itemTotal">$0.00</strong></p>
            <button type="button" id="addToCart">Add to Cart</button>
        </form>

        <section class="cart" aria-live="polite">
            <h2>Your Cart</h2>
            <p id="emptyCart">Your cart is empty.</p>
            <table id="cartTable" hidden>
                <thead>
                    <tr><th>Color</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody id="cartBody"></tbody>
            </table>
            <p class="cart-total">Order total: <strong id="cartTotal">$0.00</strong></p>
            <button type="button" id="placeOrder" disabled>Place Order</button>
            <p id="orderMessage" class="order-message" hidden></p>
        </section>
    </div>
    </main>
</body>
<footer>Lydia Winder</footer>
</html>
